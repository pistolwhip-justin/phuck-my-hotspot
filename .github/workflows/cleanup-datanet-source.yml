name: Clean DataNet references from imported source

on:
  push:
    paths:
      - '.github/workflows/cleanup-datanet-source.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch or commit to use as the cleanup starting point
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cleanup-datanet-source
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested starting point
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create isolated cleanup branch
        id: branch
        shell: bash
        run: |
          BRANCH="cleanup/remove-datanet-source-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Migrate source branding and package references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import sys

          root = Path("source-import/datnet-share-v5-final/source")
          if not root.is_dir():
              raise SystemExit(f"Expected source directory not found: {root}")

          # Keep legal notices and license texts intact. This is a branding/package
          # migration only; no networking, socket, VPN, Wi-Fi Direct, or service logic
          # is rewritten.
          excluded_names = {
              "LICENSE", "LICENSE.md", "LICENSE.txt", "NOTICE", "NOTICE.md",
              "COPYING", "COPYING.txt"
          }
          replacements = [
              ("com.datanet.share", "pro.pistolwhip.phuckmyhotspot"),
              ("com/datanet/share", "pro/pistolwhip/phuckmyhotspot"),
              ("com\\.datanet\\.share", "pro\\.pistolwhip\\.phuckmyhotspot"),
              ("datanet_share_service", "phuck_my_hotspot_service"),
              ("DataNetShare", "PhuckMyHotspot"),
              ("DataNet Share", "Phuck My Hotspot"),
              ("DataNetShare", "PhuckMyHotspot"),
              ("Theme.DataNetShare", "Theme.PhuckMyHotspot"),
              ("datnet-share", "phuck-my-hotspot"),
              ("DataNet", "Phuck My Hotspot"),
              ("datanet", "phuckmyhotspot"),
          ]

          # Replace textual references in source files only; skip binary/generated
          # content and preserve legal notice files verbatim.
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name in excluded_names:
                  continue
              if ".cxx" in path.parts:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")

          # Move Kotlin/Java package source directories to match the new namespace.
          old_pkg = root / "app/src/main/java/com/datanet/share"
          new_pkg = root / "app/src/main/java/pro/pistolwhip/phuckmyhotspot"
          if old_pkg.exists():
              new_pkg.parent.mkdir(parents=True, exist_ok=True)
              if new_pkg.exists():
                  shutil.copytree(old_pkg, new_pkg, dirs_exist_ok=True)
                  shutil.rmtree(old_pkg)
              else:
                  shutil.move(str(old_pkg), str(new_pkg))
          # Remove now-empty legacy package directories.
          for candidate in [
              root / "app/src/main/java/com/datanet",
              root / "app/src/main/java/com",
          ]:
              if candidate.exists():
                  try:
                      candidate.rmdir()
                  except OSError:
                      pass

          # Generated native build output is reproducible and not source.
          for generated in list(root.rglob(".cxx")):
              if generated.is_dir():
                  shutil.rmtree(generated)

          # Verify no legacy package/brand identifiers remain in non-legal text.
          patterns = [
              re.compile(r"com[./]datanet[./]share", re.I),
              re.compile(r"datanet_share_service", re.I),
              re.compile(r"DataNet\s*Share|DataNetShare|datnet-share", re.I),
              re.compile(r"Theme\.DataNetShare", re.I),
          ]
          findings = []
          for path in root.rglob("*"):
              if not path.is_file() or path.name in excluded_names or ".cxx" in path.parts:
                  continue
              try:
                  data = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(data.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f"{path}:{number}: {line.strip()}")
          if findings:
              print("Legacy identifiers remain:")
              print("\n".join(findings))
              raise SystemExit(1)

          print("Source migration and legacy identifier scan completed.")
          PY

      - name: Write accurate project README
        working-directory: source-import/datnet-share-v5-final/source
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Phuck My Hotspot

          Share your Android phone's mobile data with other devices using Wi-Fi Direct and Android's VPN APIs, without using the carrier hotspot feature.

          This is an independently rebranded copy of an upstream Android application originally published by Keggin-AI. The rebranding is intended to preserve the existing implementation and behavior; it does not independently validate upstream performance claims or carrier compatibility.

          ## Features retained from the upstream project

          - No root required — uses Android's VpnService and Wi-Fi Direct APIs
          - Wi-Fi Direct phone-to-phone, local-only USB/Wi-Fi to PC/Mac, and receiver modes
          - SOCKS5 TCP and UDP support
          - Cellular-bound upstream sockets
          - Screen-off operation using a partial wake lock
          - Built-in UDP connectivity test
          - No telemetry, analytics, or trackers according to the upstream documentation

          Refer to the retained technical documentation for setup instructions, architecture notes, and troubleshooting. Historical technical material may retain original project identifiers where changing them could affect attribution or technical accuracy.

          ## Install the test APK

          Download the test APK from the [Phuck My Hotspot GitHub Releases](https://github.com/pistolwhip-justin/phuck-my-hotspot/releases). The test build is debug-signed for sideload testing and is not a production/Play Store release. The new application ID allows it to install alongside the original app.

          ## Project contact

          - **Developer:** Justin S.
          - **Company:** Pistolwhip Productions LLC
          - **Website:** https://pistolwhip.pro
          - **Email:** justin@pistolwhip.pro
          - **Support:** [GitHub Issues](https://github.com/pistolwhip-justin/phuck-my-hotspot/issues)

          ## License and attribution

          The imported upstream project is MIT-licensed. Original license and copyright notices are retained with the imported material. Rebranding and repository-specific additions are by Justin S. / Pistolwhip Productions LLC; this does not remove or replace upstream attribution.
          EOF

      - name: Confirm source-only change scope
        shell: bash
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess, sys
          changed = subprocess.check_output(
              ["git", "status", "--short", "--untracked-files=all"],
              text=True
          ).splitlines()
          allowed = (
              "source-import/datnet-share-v5-final/source/",
          )
          outside = [line for line in changed if not any(p in line[3:] for p in allowed)]
          if outside:
              print("Changes outside the requested source directory:")
              print("\n".join(outside))
              sys.exit(1)
          PY

      - name: Commit and push cleanup branch
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-import/datnet-share-v5-final/source/
          if git diff --cached --quiet; then
            echo "No source changes were produced; refusing to create an empty branch commit."
            exit 1
          fi
          git commit -m "Remove DataNet branding from imported source"
          git push origin "${{ steps.branch.outputs.name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build and test imported source
        id: build
        working-directory: source-import/datnet-share-v5-final/source
        shell: bash
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.6-test-${{ github.run_number }}
          name: Phuck My Hotspot v5.0.6 Test Build ${{ github.run_number }}
          body: |
            Automated debug-signed test build from the isolated source-cleanup branch.
            Unit tests and Android debug assembly completed successfully.
            This is a prerelease for sideload testing, not a production/Play Store release.
          prerelease: true
          make_latest: false
          files: source-import/datnet-share-v5-final/source/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request for review
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh pr create             --repo "${GITHUB_REPOSITORY}"             --head "${{ steps.branch.outputs.name }}"             --base "${{ inputs.base_ref }}"             --title "Remove DataNet branding from imported source"             --body "Automated source-only package and branding cleanup. The workflow verifies that legacy package/branding identifiers are absent from non-legal source text and runs the imported Android project's unit tests and debug build. Networking implementation is intentionally unchanged. Please review the diff before merging."
