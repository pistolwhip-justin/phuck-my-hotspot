name: Release Phuck My Hotspot 5.0.5

on:
  push:
    branches:
      - main
    paths:
      - "source-import/datnet-share-v5-final/source/**"
      - ".github/workflows/release-5.0.5.yml"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4
      - name: Guard immutable release
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v5.0.5 --json assets > /tmp/release.json 2>/dev/null; then
            if jq -e '.assets[] | select(.name == "PhuckMyHotspot-v5.0.5-debug.apk")' /tmp/release.json >/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release exists without expected APK; refusing to overwrite."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.5
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Install Android SDK components
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Run unit tests and assemble debug APK
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd source-import/datnet-share-v5-final/source
          gradle --no-daemon testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PhuckMyHotspot-v5.0.5-debug.apk"
      - name: Upload APK as a temporary build artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PhuckMyHotspot-v5.0.5-debug
          path: PhuckMyHotspot-v5.0.5-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create immutable release and upload APK
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v5.0.5 "$GITHUB_WORKSPACE/PhuckMyHotspot-v5.0.5-debug.apk" \
            --target "$SOURCE_SHA" \
            --title "Phuck My Hotspot v5.0.5 — Diagnostics Integration Test APK" \
            --notes "## Phuck My Hotspot v5.0.5 test build

          - Rebranded application: Phuck My Hotspot.
          - Promotes existing diagnostic instrumentation into the production code line.
          - Includes diagnostic log export.
          - Debug-signed APK for sideload testing; not a Play Store release.
          - Application ID: pro.pistolwhip.phuckmyhotspot
          - Automated unit tests and APK assembly run in this workflow.
          - Physical-device and long-duration behavior still require user validation."
