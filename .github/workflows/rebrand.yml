name: Apply Phuck My Hotspot rebrand

on:
  push:
    paths:
      - ".github/workflows/rebrand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace application branding in text sources and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          replacements = [
              ("Phuck StraightTalk DiagnosticWTF", "Phuck My Hotspot"),
              ("Phuck StraightTalk", "Phuck My Hotspot"),
              ("DiagnosticWTF", "Phuck My Hotspot"),
              ("phuckstraighttalk.diagnostic", "phuckmyhotspot"),
              ("phuckstraighttalk", "phuckmyhotspot"),
          ]
          skipped = {".zip", ".apk", ".jpg", ".jpeg", ".png", ".webp", ".jar", ".o", ".so", ".a", ".db"}
          changed = []
          for name in filter(None, paths):
              p = Path(name)
              if ".github/workflows/" in name or any(name.endswith(ext) for ext in skipped) or ".cxx/" in name:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding="utf-8")
                  changed.append(name)
          print("Updated text files:")
          print("\n".join(changed))
          PY
      - name: Commit branding changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand application as Phuck My Hotspot"
          git push
