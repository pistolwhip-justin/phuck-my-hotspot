name: Import complete Phuck StraightTalk repository

on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy every tracked file from merged source commit
        env:
          SOURCE_REPO: pistolwhip-justin/phuck-straighttalk
          SOURCE_COMMIT: dffb72b61789fd57fb46669811ebd1268de5a793
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone "https://github.com/${SOURCE_REPO}.git" "$tmp/source"
          git -C "$tmp/source" checkout --detach "$SOURCE_COMMIT"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -C "$tmp/source" --exclude=.git --exclude=.github -cf - . | tar -xf -
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import complete merged Phuck StraightTalk source"
          git push origin HEAD:main
# Preserve destination repository metadata while copying source contents.
